<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar a Hero Clean no Google</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="logo/logo.gif">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f0f 100%);
            background-attachment: fixed;
            color: rgba(255, 255, 255, 0.82);
            line-height: 1.75;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .aviso img { width: 64px; height: 64px; border-radius: 14px; }
        .aviso p   { margin-top: 18px; }

        .aviso a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 26px;
            border-radius: 999px;
            background: #4285f4;
            color: #fff;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="aviso">
        <img src="logo/logo.gif" alt="Hero Clean">
        <p>Abrindo as estrelas da Hero Clean no Google...</p>
        <a id="destino" href="https://search.google.com/local/writereview?placeid=ChIJhRVx9F_s4SgRTj7lcmDtgak">Abrir agora</a>
    </div>

    <script>
        // Ponte pra avaliacao: o cliente cai direto na caixa de estrelas,
        // sem passar pelo perfil e sem ter que procurar o botao.
        // Se a ficha do Google mudar de endereco um dia, troca-se so aqui,
        // sem reenviar link pra ninguem.
        (() => {
            const alvo = 'https://search.google.com/local/writereview?placeid=ChIJhRVx9F_s4SgRTj7lcmDtgak';
            document.getElementById('destino').href = alvo;
            location.replace(alvo);
        })();
    </script>

</body>
</html>
